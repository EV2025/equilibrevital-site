name: Layout guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  responsive-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier les protections responsive
        run: node scripts/check-layout-guards.mjs
