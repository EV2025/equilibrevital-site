name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Empêche deux déploiements GitHub Pages de partir en même temps.
# Si un déploiement est déjà en cours, le suivant attend au lieu d'échouer.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate site
        run: python3 scripts/validate_site.py

      - name: Prepare static files
        run: |
          mkdir -p _site
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.firebaserc.example' \
            --exclude='_site' \
            --exclude='_config.yml' \
            --exclude='_data' \
            --exclude='_includes' \
            --exclude='_layouts' \
            --exclude='src' \
            --exclude='scripts' \
            --exclude='docs' \
            --exclude='/*.md' \
            --exclude='/V*.txt' \
            --exclude='/README*.txt' \
            --exclude='/FIRESTORE_ADMIN_A_CREER.json' \
            --exclude='/firebase.json' \
            --exclude='/firestore.indexes.json' \
            --exclude='/*.rules' \
            --exclude='/wp-content/uploads/*.txt' \
            ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
