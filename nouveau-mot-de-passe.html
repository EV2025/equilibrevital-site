<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Créer un nouveau mot de passe — Équilibre Vital</title>
<meta content="noindex,nofollow" name="robots"/>
<meta content="#FFF7FB" name="theme-color"/>
<link href="./assets/css/common-v58.min.css" rel="stylesheet"/>
<link href="./assets/css/form-comfort-v80.css" rel="stylesheet"/>
<style>
body{margin:0;min-width:320px;background:#fff8fc;color:#24112f;font-family:Inter,Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.password-action-main-v82{width:min(720px,calc(100vw - 28px));margin:0 auto;padding:clamp(24px,6vw,72px) 0}.password-action-card-v82{padding:clamp(18px,4vw,34px);border:1px solid rgba(124,58,237,.2);border-radius:28px;background:#fff;box-shadow:0 18px 45px rgba(67,33,83,.1)}
</style>
</head>
<body>
<main class="password-action-main-v82" id="main">
<section class="password-action-card-v82">
<p class="eyebrow">Accès sécurisé</p>
<h1>Créer un nouveau mot de passe</h1>
<p id="password-action-account">Vérification du lien sécurisé…</p>
<form class="form-comfort-v80 form-grid small" hidden id="new-password-form">
<label>Nouveau mot de passe<input autocomplete="new-password" minlength="8" name="password" required type="password"/></label>
<label>Confirmer le mot de passe<input autocomplete="new-password" minlength="8" name="passwordConfirm" required type="password"/></label>
<button class="btn" type="submit">Enregistrer mon nouveau mot de passe</button>
</form>
<p aria-live="polite" class="msg" hidden id="password-action-status"></p>
<a class="btn" hidden id="password-action-return" href="./member/dashboard.html">Se connecter</a>
<p class="notice"><a href="./mot-de-passe-oublie.html">Demander un nouveau lien</a></p>
</section>
</main>
<script defer src="./assets/js/auth-comfort.js?v=20260829-82"></script>
<script defer src="./assets/js/password-action.js?v=20260829-82" type="module"></script>
